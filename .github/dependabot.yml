# Weekly dependency updates. Minor and patch bumps are grouped into one PR per app;
# major bumps arrive individually so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/employee-agent
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /apps/config-api
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /apps/meeting-agent
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /apps/chrome-extension
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
