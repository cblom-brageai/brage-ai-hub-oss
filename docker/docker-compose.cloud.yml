version: '3.9'
# Cloud Run deployment — each service is deployed separately.
# This compose file is for local integration testing of the cloud configuration.
# For actual Cloud Run deployment, use the GitHub Actions workflow.

services:
  employee-marketing-manager:
    build:
      context: ../apps/employee-agent
    container_name: employee-marketing-manager
    ports:
      - "8000:8000"
    volumes:
      - ./employees/marketing-manager:/app/config
    environment:
      - EMPLOYEE_ID=marketing-manager
      - CONFIG_DIR=/app/config
      - FS_BACKEND=disk
      - FS_ROOT=/app/config/artefacts
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - PRIVACY_MODE=false

  config-api:
    build:
      context: ../apps/config-api
    container_name: config-api
    ports:
      - "8090:8090"
    volumes:
      - ./employees:/employees
    environment:
      - CONFIG_ROOT=/employees
      - GIT_ENABLED=true
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-config@brageai.no}
