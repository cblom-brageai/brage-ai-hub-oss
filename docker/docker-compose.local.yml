name: brage_ai_hub

services:
  employee-marketing-manager:
    build:
      context: ../apps/employee-agent
    container_name: employee-marketing-manager
    ports:
      - "8001:8000"
    volumes:
      - ./employees/marketing-manager/config:/app/config
    environment:
      - EMPLOYEE_ID=marketing-manager
      - CONFIG_DIR=/app/config
      - FS_BACKEND=${FS_BACKEND:-disk}
      - FS_ROOT=/app/config/artefacts
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PRIVACY_MODE=${PRIVACY_MODE:-false}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_DEFAULT_CHANNEL=marketing
    depends_on:
      - config-api
    restart: unless-stopped

  employee-bid-manager:
    build:
      context: ../apps/employee-agent
    container_name: employee-bid-manager
    ports:
      - "8002:8000"
    volumes:
      - ./employees/bid-manager/config:/app/config
    environment:
      - EMPLOYEE_ID=bid-manager
      - CONFIG_DIR=/app/config
      - FS_BACKEND=${FS_BACKEND:-disk}
      - FS_ROOT=/app/config/artefacts
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PRIVACY_MODE=${PRIVACY_MODE:-false}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_DEFAULT_CHANNEL=tenders
    depends_on:
      - config-api
    restart: unless-stopped

  employee-project-manager:
    build:
      context: ../apps/employee-agent
    container_name: employee-project-manager
    ports:
      - "8003:8000"
    volumes:
      - ./employees/project-manager/config:/app/config
    environment:
      - EMPLOYEE_ID=project-manager
      - CONFIG_DIR=/app/config
      - FS_BACKEND=${FS_BACKEND:-disk}
      - FS_ROOT=/app/config/artefacts
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PRIVACY_MODE=${PRIVACY_MODE:-false}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_DEFAULT_CHANNEL=projects
    depends_on:
      - config-api
    restart: unless-stopped

  employee-quality-manager:
    build:
      context: ../apps/employee-agent
    container_name: employee-quality-manager
    ports:
      - "8004:8000"
    volumes:
      - ./employees/quality-manager/config:/app/config
    environment:
      - EMPLOYEE_ID=quality-manager
      - CONFIG_DIR=/app/config
      - FS_BACKEND=${FS_BACKEND:-disk}
      - FS_ROOT=/app/config/artefacts
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PRIVACY_MODE=${PRIVACY_MODE:-false}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_DEFAULT_CHANNEL=quality
    depends_on:
      - config-api
    restart: unless-stopped

  employee-omengineer:
    build:
      context: ../apps/employee-agent
    container_name: employee-omengineer
    ports:
      - "8005:8000"
    volumes:
      - ./employees/omengineer/config:/app/config
    environment:
      - EMPLOYEE_ID=omengineer
      - CONFIG_DIR=/app/config
      - FS_BACKEND=${FS_BACKEND:-disk}
      - FS_ROOT=/app/config/artefacts
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PRIVACY_MODE=${PRIVACY_MODE:-false}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_DEFAULT_CHANNEL=operations
    depends_on:
      - config-api
    restart: unless-stopped

  config-api:
    build:
      context: ../apps/config-api
    container_name: config-api
    ports:
      - "8090:8090"
    volumes:
      - ./employees:/employees
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CONFIG_ROOT=/employees
      - GIT_ENABLED=${GIT_ENABLED:-false}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-config@brageai.no}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - DEFAULT_EMPLOYEE=marketing-manager
      - MARKETING_MANAGER_URL=http://employee-marketing-manager:8000
      - BID_MANAGER_URL=http://employee-bid-manager:8000
      - PROJECT_MANAGER_URL=http://employee-project-manager:8000
      - QUALITY_MANAGER_URL=http://employee-quality-manager:8000
      - OMENGINEER_URL=http://employee-omengineer:8000
      - DEVELOPER_URL=http://employee-developer:8000
      - SLACK_CHANNEL_ROUTING={"marketing":"marketing-manager","general":"marketing-manager","tenders":"bid-manager","projects":"project-manager","quality":"quality-manager","operations":"omengineer","dev":"developer","software":"developer"}
      - SLACK_BACKLOG_CHANNELS=["backlog"]
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped

  github-mcp:
    image: ghcr.io/github/github-mcp-server:latest
    container_name: github-mcp
    ports:
      - "8011:8082"
    environment:
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN}
    command: ["http", "--port", "8082", "--toolsets", "repos,git,pull_requests,issues,actions"]
    restart: unless-stopped

  employee-developer:
    build:
      context: ../apps/employee-agent
    container_name: employee-developer
    ports:
      - "8006:8000"
    volumes:
      - ./employees/developer/config:/app/config
    environment:
      - EMPLOYEE_ID=developer
      - CONFIG_DIR=/app/config
      - FS_BACKEND=${FS_BACKEND:-disk}
      - FS_ROOT=/app/config/artefacts
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PRIVACY_MODE=${PRIVACY_MODE:-false}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_DEFAULT_CHANNEL=dev
    depends_on:
      - config-api
      - github-mcp
    restart: unless-stopped

  meeting-agent:
    build:
      context: ../apps/meeting-agent
    container_name: meeting-agent
    ports:
      - "8010:8010"
    volumes:
      - ./meetings/agents:/app/agent-configs
      - ./employees:/employees:ro
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SONIOX_API_KEY=${SONIOX_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
      - EMPLOYEE_AGENT_URLS={"marketing-manager":"http://employee-marketing-manager:8000","bid-manager":"http://employee-bid-manager:8000","project-manager":"http://employee-project-manager:8000","quality-manager":"http://employee-quality-manager:8000","omengineer":"http://employee-omengineer:8000","developer":"http://employee-developer:8000"}
      - EMPLOYEES_DIR=/employees
    depends_on:
      - employee-marketing-manager
      - employee-bid-manager
      - employee-project-manager
      - employee-quality-manager
      - employee-omengineer
    restart: unless-stopped

  frontend:
    build:
      context: ../apps/frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./employees:/employees
    environment:
      - CONFIG_API_URL=http://config-api:8090
      - MEETING_AGENT_URL=http://meeting-agent:8010
      - EMPLOYEES_DIR=/employees
      - MARKETING_MANAGER_URL=http://employee-marketing-manager:8000
      - BID_MANAGER_URL=http://employee-bid-manager:8000
      - PROJECT_MANAGER_URL=http://employee-project-manager:8000
      - QUALITY_MANAGER_URL=http://employee-quality-manager:8000
      - OMENGINEER_URL=http://employee-omengineer:8000
      - DEVELOPER_URL=http://employee-developer:8000
      - EMPLOYEE_ID=marketing-manager
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-brage-ai-hub}
    depends_on:
      - config-api
      - meeting-agent
      - employee-marketing-manager
      - employee-bid-manager
      - employee-project-manager
      - employee-quality-manager
      - employee-omengineer
      - employee-developer
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["privacy"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
